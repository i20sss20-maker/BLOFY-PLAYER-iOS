name: BLOFY iOS unsigned preview
on:
  workflow_dispatch:
  push:
    branches: [ios-build]
    paths: ['ios/**', '.github/workflows/ios-preview-unsigned.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BLOFY_IOS_BUILD_NUMBER: ${{ github.run_number }}
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: bash ios/build_unsigned.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-iOS-unsigned-${{ github.run_number }}
          path: ios/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-iOS-logs-${{ github.run_number }}
          path: ios/build/*.log
          if-no-files-found: ignore
